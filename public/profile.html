<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملف الشخصي | AM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0b1220;--muted:#566175;--line:#e2e8f0;--primary:#0284c7;--on-primary:#fff;--accent:#d97706;--ok:#16a34a;--bad:#dc2626;--glow:rgba(2,132,199,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--glow:rgba(56,189,248,.14)}}
:root[data-theme="dark"]{--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--glow:rgba(56,189,248,.14)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:20px 16px 40px;background-image:radial-gradient(ellipse 70% 35% at 50% 0,var(--glow),transparent)}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700}.back:hover{color:var(--primary)}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.head{display:flex;align-items:center;gap:16px}
.head::before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,var(--primary),var(--accent))}
.av{width:68px;height:68px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:1.6rem;font-weight:900;color:var(--on-primary);background:linear-gradient(135deg,var(--primary),var(--accent))}
h1{margin:0;font-size:1.4rem;font-weight:900}.m{margin:0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
h2{margin:0 0 14px;font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:8px}h2 i{color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:block}
a.st:hover{border-color:var(--primary)}
.st b{display:block;font-size:1.5rem;font-weight:900;color:var(--primary)}.st b.sm{font-size:.95rem;line-height:2.2}.st span{color:var(--muted);font-size:.82rem;font-weight:700}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.rows div:last-child{border:0}.rows span{color:var(--muted);font-weight:700}.rows b{text-align:left;overflow-wrap:anywhere}
.g{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label{font-weight:700;font-size:.9rem;color:var(--muted)}
input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus-visible,select:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px var(--glow)}
input:disabled{opacity:.65;cursor:not-allowed}
.hint{color:var(--muted);font-size:.8rem;margin:-6px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.p{background:var(--primary);color:var(--on-primary);border-color:transparent}.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:hover:not(:disabled){filter:brightness(1.07)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sec p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:700;z-index:50;max-width:90%;text-align:center}
@media(max-width:560px){.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .st:last-child{grid-column:span 2}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="dashboard.html"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</a>

  <section class="box head">
    <div class="av" id="av">..</div>
    <div><h1 id="hName">جارٍ التحميل...</h1><p class="m" id="hEmail"></p><p class="m" id="hJoined"></p></div>
  </section>

  <div class="stats">
    <a class="st" href="my-properties.html"><b id="sProps">-</b><span>عقاراتي</span></a>
    <a class="st" href="chat.html"><b id="sRooms">-</b><span>محادثاتي</span></a>
    <div class="st"><b class="sm" id="sLast">-</b><span>آخر دخول</span></div>
  </div>

  <section class="box" id="viewBox">
    <h2><i class="fas fa-user"></i> بيانات الحساب</h2>
    <div class="rows">
      <div><span>الاسم</span><b id="vName">-</b></div>
      <div><span>رقم الهاتف</span><b id="vPhone">-</b></div>
      <div><span>البريد الإلكتروني</span><b id="vEmail">-</b></div>
      <div><span>المنطقة</span><b id="vArea">-</b></div>
    </div>
    <div class="acts"><button class="btn p" id="editBtn" type="button"><i class="fas fa-edit"></i> تعديل البيانات</button></div>
  </section>

  <form class="box" id="editBox" hidden novalidate>
    <h2><i class="fas fa-user-edit"></i> تعديل البيانات</h2>
    <div class="g"><label for="fName">الاسم الكامل</label><input id="fName" maxlength="50" autocomplete="name"></div>
    <div class="two">
      <div class="g"><label for="fGov">المحافظة</label><select id="fGov"><option value="">غير محددة</option></select></div>
      <div class="g"><label for="fCity">المدينة / المنطقة</label><input id="fCity" maxlength="40"></div>
    </div>
    <div class="two">
      <div class="g"><label for="fPhone">رقم الهاتف</label><input id="fPhone" disabled></div>
      <div class="g"><label for="fEmail">البريد الإلكتروني</label><input id="fEmail" disabled></div>
    </div>
    <p class="hint">لتغيير رقم الهاتف أو البريد تواصل مع الدعم الفني.</p>
    <div class="acts"><button class="btn p" type="submit" id="saveBtn">حفظ التغييرات</button><button class="btn" type="button" id="cancelBtn">إلغاء</button></div>
  </form>

  <section class="box sec">
    <h2><i class="fas fa-shield-alt"></i> الأمان</h2>
    <p>لتغيير كلمة المرور سنرسل رابطاً إلى بريدك الإلكتروني.</p>
    <div class="acts" style="margin-top:0">
      <button class="btn" type="button" id="pwBtn"><i class="fas fa-key"></i> تغيير كلمة المرور</button>
      <button class="btn bad" type="button" id="logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, serverTimestamp, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, query as rtQuery, orderByChild, equalTo, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBfOJPkWbmcJ6s29bDNysr-H0Kx-Js3Gy0",
  authDomain: "am--rewards.firebaseapp.com",
  databaseURL: "https://am--rewards-default-rtdb.firebaseio.com",
  projectId: "am--rewards",
});
const db = getFirestore(app), auth = getAuth(app), rtdb = getDatabase(app);

const $ = (s) => document.querySelector(s);
const num = (n) => Number(n || 0).toLocaleString("ar-EG");
const GOVS = ["القاهرة","الجيزة","الإسكندرية","القليوبية","المنوفية","الغربية","الدقهلية","الشرقية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","شمال سيناء","جنوب سيناء","بني سويف","الفيوم","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح"];
$("#fGov").insertAdjacentHTML("beforeend", GOVS.map((g) => `<option>${g}</option>`).join(""));

const S = { uid: null, user: null, statsLoaded: false };
function toast(t) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
const fmtDate = (ts, withTime) => {
  const d = ts?.toDate?.(); if (!d) return "-";
  return d.toLocaleDateString("ar-EG", { day: "numeric", month: "long", year: "numeric" }) + (withTime ? " " + d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }) : "");
};

function render() {
  const u = S.user, name = u.name || "";
  $("#av").textContent = (name || "A").charAt(0);
  $("#hName").textContent = name || "حسابي";
  $("#hEmail").textContent = u.email || "";
  $("#hJoined").textContent = u.createdAt ? "انضممت في " + fmtDate(u.createdAt) : "";
  $("#sLast").textContent = fmtDate(u.lastLogin, true);
  $("#vName").textContent = name || "-";
  $("#vPhone").textContent = u.phone || "-";
  $("#vEmail").textContent = u.email || "-";
  $("#vArea").textContent = [u.governorate, u.city].filter(Boolean).join("، ") || "-";
  if ($("#editBox").hidden) {
    $("#fName").value = name; $("#fGov").value = u.governorate || ""; $("#fCity").value = u.city || "";
    $("#fPhone").value = u.phone || ""; $("#fEmail").value = u.email || "";
  }
}

async function loadStats(uid) {
  try {
    const c = await getCountFromServer(query(collection(db, "properties"), where("ownerId", "==", uid)));
    $("#sProps").textContent = num(c.data().count);
  } catch (e) { console.warn(e); $("#sProps").textContent = "-"; }
  try {
    // نجلب غرف المستخدم فقط (كمشتري أو كمالك) بدل تحميل كل المحادثات
    const q = (k) => get(rtQuery(ref(rtdb, "chatRooms"), orderByChild(k), equalTo(uid)));
    const [a, b] = await Promise.all([q("buyerId"), q("ownerId")]);
    $("#sRooms").textContent = num(a.size + b.size);
  } catch (e) { console.warn(e); $("#sRooms").textContent = "-"; }
}

$("#editBtn").addEventListener("click", () => { $("#viewBox").hidden = true; $("#editBox").hidden = false; });
$("#cancelBtn").addEventListener("click", () => { $("#editBox").hidden = true; $("#viewBox").hidden = false; render(); });

$("#editBox").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("#fName").value.trim();
  if (name.length < 3) return toast("الاسم يجب ألا يقل عن 3 أحرف");
  $("#saveBtn").disabled = true;
  try {
    await updateDoc(doc(db, "users", S.uid), { name, governorate: $("#fGov").value, city: $("#fCity").value.trim(), updatedAt: serverTimestamp() });
    updateProfile(auth.currentUser, { displayName: name }).catch(() => {});
    $("#editBox").hidden = true; $("#viewBox").hidden = false;
    toast("تم حفظ بياناتك");
  } catch (err) { console.error(err); toast("تعذّر الحفظ، حاول مرة أخرى"); }
  $("#saveBtn").disabled = false;
});

$("#pwBtn").addEventListener("click", async () => {
  const email = S.user?.email || auth.currentUser?.email;
  if (!email) return toast("لا يوجد بريد مرتبط بالحساب");
  const b = $("#pwBtn"); b.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    toast("تم إرسال رابط تغيير كلمة المرور إلى بريدك (راجع Spam أيضاً)");
    setTimeout(() => { b.disabled = false; }, 30000);
  } catch (err) { console.error(err); toast("تعذّر الإرسال، حاول لاحقاً"); b.disabled = false; }
});

$("#logout").addEventListener("click", async () => {
  if (!confirm("هل تريد تسجيل الخروج؟")) return;
  await signOut(auth); location.href = "login.html";
});

let unsub = null;
onAuthStateChanged(auth, (u) => {
  if (!u) { location.href = "login.html"; return; }
  S.uid = u.uid;
  if (unsub) unsub();
  unsub = onSnapshot(doc(db, "users", u.uid), (snap) => {
    if (!snap.exists()) { location.href = "login.html"; return; }
    S.user = snap.data();
    if (S.user.isBanned) { signOut(auth).then(() => (location.href = "login.html")); return; }
    render();
    if (!S.statsLoaded) { S.statsLoaded = true; loadStats(u.uid); }
  }, (err) => { console.error(err); toast("تعذّر تحميل بياناتك، حدّث الصفحة"); });
});
</script>
</body>
</html>
