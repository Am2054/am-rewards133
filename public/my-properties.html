<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عقاراتي | AM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0b1220;--muted:#566175;--line:#e2e8f0;--primary:#0284c7;--on-primary:#fff;--accent:#d97706;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;--glow:rgba(2,132,199,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--glow:rgba(56,189,248,.14)}}
:root[data-theme="dark"]{--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--glow:rgba(56,189,248,.14)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:20px 16px 40px;background-image:radial-gradient(ellipse 70% 35% at 50% 0,var(--glow),transparent)}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;margin-bottom:10px}.back:hover{color:var(--primary)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:1.7rem;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem}
.btn.p{background:var(--primary);color:var(--on-primary);border-color:transparent}.btn:hover:not(:disabled){filter:brightness(1.07)}.btn:disabled{opacity:.55;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stats b{display:block;font-size:1.4rem;font-weight:900;color:var(--primary)}.stats span{color:var(--muted);font-size:.85rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pc.off .ph img{filter:grayscale(.7);opacity:.75}
.ph{position:relative;aspect-ratio:16/10;background:var(--line)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;right:12px;padding:3px 14px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--card)}
.badge.sale{color:var(--primary)}.badge.rent{color:var(--ok)}
.rib{position:absolute;inset:auto 0 0 0;padding:6px;text-align:center;color:#fff;font-weight:900;font-size:.9rem;background:rgba(15,23,42,.78)}
.pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid var(--line)}
.chip.pending{color:var(--warn);border-color:var(--warn)}.chip.approved{color:var(--ok);border-color:var(--ok)}.chip.rejected{color:var(--bad);border-color:var(--bad)}
.chip.av{color:var(--primary);border-color:var(--primary)}
.pb h3{margin:2px 0 0;font-size:1.08rem;line-height:1.5}
.price{font-size:1.2rem;font-weight:900;color:var(--primary)}.price small{font-size:.78rem;color:var(--muted);font-weight:600}
.geo,.dt{margin:0;color:var(--muted);font-size:.86rem}
.why{background:rgba(220,38,38,.07);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:.86rem;font-weight:600}
.acts{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.acts .btn,.acts select{flex:1 1 130px}
select{font:inherit;font-size:.9rem;font-weight:700;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
select:focus-visible,.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted);font-weight:700}
.empty i{font-size:2.4rem;color:var(--primary);display:block;margin-bottom:10px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:22px;max-width:380px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.4)}dialog p{margin:0 0 16px;line-height:1.8}dialog .r{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:700;z-index:50}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="dashboard.html"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</a>
  <div class="head">
    <h1>عقاراتي</h1>
    <a class="btn p" href="add-property.html"><i class="fas fa-plus"></i> إضافة عقار</a>
  </div>
  <div class="stats" id="stats" hidden></div>
  <div class="grid" id="list"><p class="empty">جارٍ التحميل...</p></div>
</div>

<dialog id="dlg"><p id="dlgText"></p><div class="r"><button class="btn" id="dlgNo" type="button">إلغاء</button><button class="btn p" id="dlgYes" type="button">تأكيد</button></div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, updateDoc, serverTimestamp, collection, query, where, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBfOJPkWbmcJ6s29bDNysr-H0Kx-Js3Gy0",
  authDomain: "am--rewards.firebaseapp.com",
  projectId: "am--rewards",
});
const db = getFirestore(app), auth = getAuth(app);

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PH = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><rect width="400" height="250" fill="#cbd5e1"/><path d="M130 190v-60l70-55 70 55v60z" fill="#94a3b8"/></svg>');
// صور Cloudinary بحجم أصغر وصيغة أخف (WebP/AVIF) لتحميل أسرع
const thumb = (u, w = 600) => (/^https?:\/\//i.test(u || "") ? (u.includes("/upload/") ? u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`) : u) : PH);
const num = (n) => Number(n || 0).toLocaleString("ar-EG");
const FEES = { sale: 0.005, rent: 0.1 };

function toast(t) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
function ask(text) {
  return new Promise((res) => {
    const d = $("#dlg"); $("#dlgText").textContent = text;
    const done = (v) => { d.close(); res(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal();
  });
}

const AV = {
  available: "متاح", reserved: "محجوز مؤقتاً", rented: "تم التأجير", sold: "تم البيع", unavailable: "غير متاح حالياً",
};
const ST = {
  pending: ['<i class="fas fa-hourglass-half"></i> قيد المراجعة', "pending"],
  approved: ['<i class="fas fa-check-circle"></i> منشور', "approved"],
  rejected: ['<i class="fas fa-times-circle"></i> مرفوض', "rejected"],
};
let items = [];

function card(p) {
  const sale = p.purpose !== "rent", av = p.availability || "available";
  const closed = av === "sold" || av === "rented";
  const off = p.isHidden === true || closed || av === "unavailable";
  const st = ST[p.status] || ST.pending;
  const when = p.createdAt?.toDate?.().toLocaleDateString("ar-EG", { day: "numeric", month: "long" }) || "قبل لحظات";
  const geo = [p.governorate, p.city].filter(Boolean).join("، ");
  const ribbon = p.isHidden ? "مخفي مؤقتاً" : closed ? AV[av] : "";
  const opts = (sale ? ["available", "reserved", "sold", "unavailable"] : ["available", "reserved", "rented", "unavailable"])
    .map((k) => `<option value="${k}" ${k === av ? "selected" : ""}>${AV[k]}</option>`).join("");
  const approved = p.status === "approved";
  const edit = p.status === "pending"
    ? `<button class="btn" type="button" data-locked><i class="fas fa-lock"></i> قيد المراجعة</button>`
    : `<a class="btn ${p.status === "rejected" ? "p" : ""}" href="edit-property.html?id=${encodeURIComponent(p.id)}"><i class="fas fa-edit"></i> ${p.status === "rejected" ? "تعديل وإعادة الإرسال" : "تعديل"}</a>`;
  return `<article class="pc ${off ? "off" : ""}" data-id="${esc(p.id)}">
    <div class="ph"><img loading="lazy" alt="" src="${esc(thumb(p.coverImage || (p.images && p.images[0])))}"><span class="badge ${sale ? "sale" : "rent"}">${sale ? "للبيع" : "للإيجار"}</span>${ribbon ? `<div class="rib">${ribbon}</div>` : ""}</div>
    <div class="pb">
      <div class="chips"><span class="chip ${st[1]}">${st[0]}</span>${approved ? `<span class="chip av">${AV[av] || ""}</span>` : ""}</div>
      <h3>${esc(p.title || "عقار")}</h3>
      <div class="price">${num(p.price)} <small>${sale ? "ج.م" : "ج.م / شهر"}</small></div>
      <p class="geo"><i class="fas fa-map-marker-alt"></i> ${esc(geo)} • ${num(p.area)} م² • ${esc(p.propertyType || "")}</p>
      <p class="dt">تاريخ الإضافة: ${when}</p>
      ${p.status === "rejected" ? `<div class="why"><b>سبب الرفض:</b> ${esc(p.rejectReason || "الإعلان مخالف لسياسة المحتوى")}</div>` : ""}
      <div class="acts">
        ${edit}
        ${approved ? `<select data-av aria-label="حالة العقار">${opts}</select>
        <button class="btn" type="button" data-hide="${p.isHidden ? 1 : 0}"><i class="fas ${p.isHidden ? "fa-eye" : "fa-eye-slash"}"></i> ${p.isHidden ? "إظهار الإعلان" : "إخفاء الإعلان"}</button>` : ""}
      </div>
    </div></article>`;
}

function render() {
  const list = $("#list");
  if (!items.length) {
    list.innerHTML = `<p class="empty"><i class="fas fa-building"></i>لم تضف أي عقار بعد.<br><br><a class="btn p" href="add-property.html">أضف أول عقار</a></p>`;
    $("#stats").hidden = true; return;
  }
  const live = items.filter((p) => p.status === "approved" && !p.isHidden && (p.availability || "available") === "available").length;
  $("#stats").hidden = false;
  $("#stats").innerHTML = [[items.length, "إجمالي العقارات"], [live, "منشور ومتاح"], [items.filter((p) => p.status === "pending").length, "قيد المراجعة"], [items.filter((p) => p.status === "rejected").length, "مرفوض"]]
    .map(([n, l]) => `<div><b>${num(n)}</b><span>${l}</span></div>`).join("");
  list.innerHTML = items.map(card).join("");
  list.querySelectorAll("img").forEach((i) => i.addEventListener("error", () => { i.src = PH; }, { once: true }));
}

const find = (el) => items.find((p) => p.id === el.closest(".pc")?.dataset.id);

$("#list").addEventListener("click", async (e) => {
  if (e.target.closest("[data-locked]")) return toast("لا يمكن التعديل أثناء المراجعة، سنخبرك عند الانتهاء.");
  const b = e.target.closest("[data-hide]"); if (!b) return;
  const p = find(b); if (!p) return;
  b.disabled = true;
  try {
    await updateDoc(doc(db, "properties", p.id), { isHidden: !p.isHidden, updatedAt: serverTimestamp() });
    toast(p.isHidden ? "تم إظهار الإعلان" : "تم إخفاء الإعلان مؤقتاً");
  } catch (err) { console.error(err); toast("تعذّر التحديث، حاول مرة أخرى"); b.disabled = false; }
});

$("#list").addEventListener("change", async (e) => {
  const s = e.target.closest("[data-av]"); if (!s) return;
  const p = find(s); if (!p) return;
  const prev = p.availability || "available", v = s.value;
  if (v === "sold" || v === "rented") {
    const fee = Number(p.price) * (p.purpose === "rent" ? FEES.rent : FEES.sale);
    const ok = await ask(`مبروك! تذكير: عمولة AM المستحقة عليك ${num(fee)} ج.م، وتُدفع عند إتمام الاتفاق. هل تم ${v === "sold" ? "البيع" : "التأجير"} فعلاً؟`);
    if (!ok) { s.value = prev; return; }
  }
  s.disabled = true;
  try {
    await updateDoc(doc(db, "properties", p.id), { availability: v, updatedAt: serverTimestamp() });
    toast("تم تحديث حالة العقار");
  } catch (err) { console.error(err); toast("تعذّر التحديث، حاول مرة أخرى"); s.value = prev; s.disabled = false; }
});

let unsub = null;
onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }
  if (unsub) unsub();
  // بدون orderBy حتى لا نحتاج فهرس مركّب في Firestore؛ الترتيب يتم هنا
  const q = query(collection(db, "properties"), where("ownerId", "==", user.uid), limit(100));
  unsub = onSnapshot(q, (snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.createdAt?.seconds ?? Infinity) - (a.createdAt?.seconds ?? Infinity));
    render();
  }, (err) => {
    console.error(err);
    $("#list").innerHTML = '<p class="empty">تعذّر تحميل عقاراتك. حدّث الصفحة وحاول مرة أخرى.</p>';
  });
});
</script>
</body>
</html>
