<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b16">
<title>تسجيل الدخول | AM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0b1220;--muted:#566175;--line:#e2e8f0;--primary:#0284c7;--on-primary:#fff;--accent:#d97706;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;--glow:rgba(2,132,199,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--glow:rgba(56,189,248,.16)}}
:root[data-theme="dark"]{--bg:#060b16;--card:#0f1626;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#38bdf8;--on-primary:#04121f;--accent:#facc15;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--glow:rgba(56,189,248,.16)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;display:grid;place-items:center;padding:20px;background-image:radial-gradient(ellipse 70% 50% at 50% 0,var(--glow),transparent)}
a{color:inherit;text-decoration:none}
.box{position:relative;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 28px;box-shadow:0 25px 50px -28px rgba(0,0,0,.5)}
.box::before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,var(--primary),var(--accent))}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--on-primary);display:grid;place-items:center;font-weight:900}
h1{margin:0 0 4px;font-size:1.7rem;font-weight:900;text-align:center}
.sub{margin:0 0 24px;color:var(--muted);text-align:center;font-size:.95rem}
.row{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:700;font-size:.92rem;color:var(--muted)}
.field{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:none}
input:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px var(--glow)}
#login-password{padding-left:48px}
.eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.eye:hover{color:var(--primary)}
.eye svg{width:20px;height:20px;fill:currentColor}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 20px;font-size:.92rem}
.rem{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;cursor:pointer}
.rem input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.link:hover{color:var(--primary)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn:focus-visible,.link:focus-visible,.eye:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.spinner{width:18px;height:18px;border:2.5px solid rgba(128,128,128,.35);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.message{margin-bottom:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--primary);text-align:center;font-weight:700;font-size:.95rem}
.message.error{color:var(--bad);border-color:var(--bad)}
.message.success{color:var(--ok);border-color:var(--ok)}
.message.warning{color:var(--warn);border-color:var(--warn)}
.banned{display:none;margin-bottom:18px;padding:20px;border:2px solid var(--bad);border-radius:14px;text-align:center;color:var(--bad)}
.banned h3{margin:0 0 6px;font-weight:900}.banned p{margin:0;font-size:.95rem}
.alt{margin-top:22px;text-align:center;font-size:.95rem;color:var(--muted)}
.alt a{color:var(--primary);font-weight:700}
.back{display:block;margin-top:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.back:hover{color:var(--text)}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
</style>
</head>
<body>
<main class="box">
  <div class="mark" aria-hidden="true">AM</div>
  <h1 id="form-title">أهلاً بعودتك</h1>
  <p class="sub">سجّل دخولك لمتابعة حسابك على AM</p>

  <div id="bannedAlert" class="banned" role="alert">
    <h3>⛔ الحساب محظور</h3>
    <p id="banReason">عذراً، حسابك مُعطّل من قبل الإدارة. للمزيد من المعلومات، يرجى التواصل مع الدعم.</p>
  </div>

  <div id="msg" class="message" style="display:none" role="status" aria-live="polite"><span id="msg-text"></span></div>

  <form id="login-form" autocomplete="on" novalidate>
    <div class="row">
      <label for="login-email">البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="example@mail.com" autocomplete="username" inputmode="email" required>
    </div>
    <div class="row">
      <label for="login-password">كلمة المرور</label>
      <div class="field">
        <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password" required>
        <button type="button" class="eye" onclick="togglePass('login-password')" aria-label="إظهار أو إخفاء كلمة المرور">
          <svg viewBox="0 0 24 24" id="eye-icon-login-password"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
    </div>
    <div class="opts">
      <label class="rem" for="remember-me" style="margin:0"><input type="checkbox" id="remember-me" checked>تذكرني</label>
      <button type="button" class="link" id="forgot-password-btn">نسيت كلمة المرور؟</button>
    </div>
    <button class="btn" id="login-btn" type="submit"><span id="btn-text">تسجيل الدخول</span></button>
  </form>

  <p class="alt">ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً جديداً</a></p>
  <a class="back" href="index.html">العودة للصفحة الرئيسية</a>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, browserSessionPersistence, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfOJPkWbmcJ6s29bDNysr-H0Kx-Js3Gy0",
  authDomain: "am--rewards.firebaseapp.com",
  projectId: "am--rewards",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const loginForm = $("login-form"), msgEl = $("msg"), msgTextEl = $("msg-text");
const loginEmail = $("login-email"), loginPassword = $("login-password");
const loginBtn = $("login-btn"), btnText = $("btn-text");
const rememberMe = $("remember-me"), forgotBtn = $("forgot-password-btn");
const bannedAlert = $("bannedAlert"), banReason = $("banReason");

const USER_PAGE = "dashboard.html";
const loginAttempts = {};
const MAX_ATTEMPTS = 5;
const LOCKOUT_TIME = 15 * 60 * 1000;

function showMessage(text, type = "success") {
  msgTextEl.textContent = text;
  msgEl.className = "message " + type;
  msgEl.style.display = text ? "block" : "none";
  clearTimeout(window._msgTimeout);
  if (text) {
    window._msgTimeout = setTimeout(() => {
      if (type !== "error") msgEl.style.display = "none";
    }, type === "error" ? 10000 : 3000);
  }
}
function showBannedAlert(reason) {
  bannedAlert.style.display = "block";
  if (reason) banReason.textContent = reason;
  loginForm.style.display = "none";
}
function hideBannedAlert() {
  bannedAlert.style.display = "none";
  loginForm.style.display = "block";
}
function setLoading(on) {
  loginBtn.disabled = on;
  if (on) btnText.innerHTML = '<span class="spinner"></span> جارٍ التحقق...';
  else btnText.textContent = "تسجيل الدخول";
}
function translateError(code) {
  switch (code) {
    case "auth/invalid-email": return "البريد الإلكتروني غير صالح";
    case "auth/user-not-found": return "هذا الحساب غير مسجل لدينا";
    case "auth/wrong-password": return "كلمة السر التي أدخلتها غير صحيحة";
    case "auth/invalid-credential": return "بيانات الدخول غير صحيحة";
    case "auth/too-many-requests": return "تم حظر المحاولة مؤقتًا بسبب عدة محاولات خاطئة، انتظر قليلًا";
    case "auth/user-disabled": return "هذا الحساب معطّل";
    case "auth/missing-email": return "يرجى كتابة البريد الإلكتروني أولاً";
    default: return "حدث خطأ، حاول مرة أخرى أو تحقق من بياناتك.";
  }
}
function checkLoginLockout(email) {
  const now = Date.now(), a = loginAttempts[email];
  if (a && a.lockoutUntil > now) {
    return { locked: true, message: `محاولات كثيرة جداً. يرجى الانتظار ${Math.ceil((a.lockoutUntil - now) / 60000)} دقيقة` };
  }
  return { locked: false };
}
function recordFailedAttempt(email) {
  const now = Date.now();
  if (!loginAttempts[email]) loginAttempts[email] = { count: 0, firstAttempt: now };
  const a = loginAttempts[email];
  a.count++;
  if (a.count >= MAX_ATTEMPTS) a.lockoutUntil = now + LOCKOUT_TIME;
}
async function updateLastLogin(uid) {
  await updateDoc(doc(db, "users", uid), { lastLogin: serverTimestamp() });
}
async function checkUserBanStatus(uid) {
  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (snap.exists()) {
      const d = snap.data();
      if (d.isBanned) return { banned: true, reason: d.banReason || "عذراً، حسابك مُعطّل من قبل الإدارة. للمزيد من المعلومات، يرجى التواصل مع الدعم." };
      return { banned: false, exists: true };
    }
    return { banned: false, exists: false };
  } catch (e) {
    console.error("Error checking ban status:", e);
    return { banned: false, exists: false };
  }
}

forgotBtn.addEventListener("click", async () => {
  const email = loginEmail.value.trim();
  if (!email) return showMessage("اكتب بريدك الإلكتروني في الحقل أولاً لنرسل لك رابط الاستعادة.", "warning");
  forgotBtn.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("📬 تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.", "success");
  } catch (e) {
    showMessage(translateError(e.code), "error");
  } finally {
    forgotBtn.disabled = false;
  }
});

async function login(event) {
  if (event) event.preventDefault();
  const email = loginEmail.value.trim();
  const password = loginPassword.value; // بدون trim: كلمة المرور قد تحتوي على مسافات
  if (!email || !password) return showMessage("يرجى إدخال البريد وكلمة المرور", "error");

  const lock = checkLoginLockout(email);
  if (lock.locked) return showMessage(lock.message, "warning");

  setLoading(true);
  try {
    await setPersistence(auth, rememberMe.checked ? browserLocalPersistence : browserSessionPersistence);
    const { user } = await signInWithEmailAndPassword(auth, email, password);

    const ban = await checkUserBanStatus(user.uid);
    if (!ban.exists) {
      await auth.signOut();
      setLoading(false);
      return showMessage("هذا الحساب غير مسجل لدينا", "error");
    }
    if (ban.banned) {
      await auth.signOut();
      showBannedAlert(ban.reason);
      setLoading(false);
      return;
    }

    hideBannedAlert();
    delete loginAttempts[email];
    await updateLastLogin(user.uid);
    showMessage("✅ تم تسجيل الدخول بنجاح!", "success");
    setTimeout(() => (window.location.href = USER_PAGE), 1200);
  } catch (e) {
    recordFailedAttempt(email);
    setLoading(false);
    showMessage(translateError(e.code), "error");
  }
}

const EYE = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
const EYE_OFF = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4.5C6.48 2.5 2 6.98 2 12s4.48 9.5 10 9.5 10-4.48 10-9.5S17.52 2.5 12 2.5zm0 17c-4.14 0-7.5-3.36-7.5-7.5S7.86 4.5 12 4.5s7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5z"/>';
window.togglePass = (id) => {
  const input = $(id), icon = $("eye-icon-" + id);
  const hidden = input.type === "password";
  input.type = hidden ? "text" : "password";
  icon.innerHTML = hidden ? EYE_OFF : EYE;
};

loginForm.addEventListener("submit", login);
</script>
</body>
</html>
